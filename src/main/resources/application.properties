spring.application.name=multi-agent

# demo convenience: browsers must revalidate static files (index/app.js/css)
# on every load, so UI edits show up on a plain refresh after an app restart
spring.web.resources.cache.cachecontrol.no-cache=true

claude.cli.path=claude
claude.cli.model=sonnet
claude.cli.timeout-seconds=180
claude.cli.max-turns=16

analysis.max-concurrent-runs=2
